name: MinGW GDB Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [ "hotfix/ccrl-hardening-2" ]

jobs:
  mingw_gdb:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    - name: Tool versions
      run: |
        g++ --version
        gdb --version
        objdump --version
        cmake --version
        ninja --version

    - name: Configure RelWithDebInfo
      run: >
        cmake -B build-gdb
        -S .
        -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_CXX_COMPILER=g++
        -DENABLE_LTO=ON
        -DENABLE_STATIC=ON
        -DBUILD_TESTS=OFF
        -DBUILD_TESTS_EXTRA=OFF
        -DBUILD_EXECUTABLES_EXTRA=OFF

    - name: Build with symbols
      run: cmake --build build-gdb --parallel --verbose

    - name: Disassemble executable
      working-directory: ./build-gdb
      run: objdump -d -C -l -Mintel casanchess.exe > disasm.txt

    - name: Reproduce under GDB
      working-directory: ./build-gdb
      run: |
        set +e

        (
          echo 'uci'
          echo 'setoption name Hash value 32'
          echo 'isready'
          sleep 1

          echo 'position startpos'
          echo 'go movetime 500'
          sleep 1

          echo 'ucinewgame'
          echo 'isready'
          sleep 1

          echo 'position startpos'
          echo 'go nodes 50000'
          sleep 1

          echo 'position fen 8/3P3k/n2K3p/2p3n1/1b4N1/2p1p1P1/8/3B4 w - - 0 1 moves g4f6 h7g7 f6h5 g7g6 d1c2'
          echo 'go infinite'
          sleep 2
          echo 'stop'
          sleep 1

          echo 'quit'
        ) | timeout 45s gdb --quiet --batch \
          -ex 'set pagination off' \
          -ex 'set confirm off' \
          -ex 'set disassembly-flavor intel' \
          -ex 'run' \
          -ex 'echo \n===== ALL THREADS =====\n' \
          -ex 'thread apply all bt' \
          -ex 'echo \n===== REGISTERS =====\n' \
          -ex 'info registers rip rsp rbp rax rbx rcx rdx rsi rdi r8 r9 r10 r11 r12 r13 r14 r15' \
          -ex 'echo \n===== STACK ALIGNMENT =====\n' \
          -ex 'p/x ((unsigned long long)$rsp) & 31' \
          -ex 'echo \n===== INSTRUCTIONS AROUND RIP =====\n' \
          -ex 'x/16i $rip-32' \
          --args ./casanchess.exe 2>&1 | tee mingw-gdb.log

        if grep -q 'received signal SIGSEGV' mingw-gdb.log; then
          echo '::error::GDB captured a segmentation fault'
          exit 1
        fi

        echo 'GDB did not capture a segmentation fault'

    - name: Upload diagnostic artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mingw-relwithdebinfo-gdb
        path: |
          build-gdb/casanchess.exe
          build-gdb/mingw-gdb.log
          build-gdb/disasm.txt
        retention-days: 7
