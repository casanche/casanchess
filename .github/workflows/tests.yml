name: Build and Test

on:
  push:
    branches: [ "master", "*/**" ]

jobs:
  build_and_test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # RELEASE - Linux
          - os: ubuntu-latest
            build_type: Release
            compiler: g++
          - os: ubuntu-latest
            build_type: Release
            compiler: clang++
          # RELEASE - Windows
          - os: windows-latest
            build_type: Release
            compiler: cl
          - os: windows-2025
            build_type: Release
            compiler: g++
          # DEBUG
          - os: ubuntu-latest
            build_type: Debug
            compiler: g++
    
    steps:
    - uses: actions/checkout@v7

    - name: Setup dependencies (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        ${{ matrix.compiler }} --version
        cmake --version

    - name: Configure with CMake
      run: >
        cmake -B build
        -S .
        ${{ runner.os == 'Windows' && matrix.compiler == 'g++' && '-G Ninja' || '' }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
        -DENABLE_STATIC=ON
        -DBUILD_TESTS=ON
        -DBUILD_TESTS_EXTRA=ON
        -DBUILD_EXECUTABLES_EXTRA=ON
        
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel
        
    - name: Fix permissions (Linux)
      if: ${{ runner.os == 'Linux' }}
      working-directory: ./build
      run: chmod +x casanchess tests perft

    - name: Tests - Unit and Perft
      working-directory: ./build
      run: |
        EXTENSION_SUFFIX=${{ runner.os == 'Windows' && '.exe' || '' }}
        BASE_PATH=${{ runner.os == 'Windows' && matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}

        for exe_name in tests perft; do
          ./${BASE_PATH}${exe_name}${EXTENSION_SUFFIX}
        done

    - name: Bench
      working-directory: ./build
      run: |
        EXTENSION_SUFFIX=${{ runner.os == 'Windows' && '.exe' || '' }}
        BASE_PATH=${{ runner.os == 'Windows' && matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}

        echo bench | ./${BASE_PATH}casanchess${EXTENSION_SUFFIX}

    - name: Smoke Test - UCI
      working-directory: ./build
      run: |
        EXTENSION_SUFFIX=${{ runner.os == 'Windows' && '.exe' || '' }}
        BASE_PATH=${{ runner.os == 'Windows' && matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}
        
        ENGINE_BIN="./${BASE_PATH}casanchess${EXTENSION_SUFFIX}"

        timeout 30s bash -c "
        (
          echo 'uci'
          echo 'setoption name Hash value 32'
          echo 'isready'
          sleep 1
          
          # 1) Startpos go movetime
          echo 'position startpos'
          echo 'go movetime 500'
          sleep 1

          # New game / Clear state
          echo 'ucinewgame'
          echo 'isready'
          sleep 1

          # 2) Startpos go nodes
          echo 'position startpos'
          echo 'go nodes 50000'
          sleep 1
          
          # 3) FEN go inifinite and stop
          echo 'position fen 8/3P3k/n2K3p/2p3n1/1b4N1/2p1p1P1/8/3B4 w - - 0 1 moves g4f6 h7g7 f6h5 g7g6 d1c2'
          echo 'go infinite'
          sleep 2
          echo 'stop'
          sleep 1
          
          echo 'quit'
        ) | $ENGINE_BIN
        "

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler }}-engine
        path: |
          build/casanchess*
          build/Release/casanchess*
          build/*.nnue
        retention-days: 2
