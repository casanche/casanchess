name: Build and Test

env:
  LLVM_MINGW_VERSION: "20260826"

on:
  push:
    branches: [ "master", "*/**" ]

jobs:
  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # RELEASE - Linux
          - os: ubuntu-latest
            name: Linux Release (GCC)
            build_type: Release
            compiler: g++
          - os: ubuntu-latest
            name: Linux Release (Clang)
            build_type: Release
            compiler: clang++
          # RELEASE - Windows
          - os: windows-latest
            name: Windows Release (MSVC)
            build_type: Release
            compiler: cl
          - os: windows-2025
            name: Windows Release (MinGW GCC)
            build_type: Release
            compiler: g++
          - os: windows-2025
            name: Windows Release (clang-cl + LLD + ThinLTO)
            build_type: Release
            compiler: clang-cl
            c_compiler: clang-cl
            toolchain: clang-cl
            linker: lld-link
          - os: windows-2025
            name: Windows Release (LLVM-MinGW + LLD + ThinLTO)
            build_type: Release
            compiler: x86_64-w64-mingw32-clang++
            c_compiler: x86_64-w64-mingw32-clang
            toolchain: llvm-mingw
          # DEBUG - Windows
          - os: windows-2025
            name: Windows Debug (MinGW GCC)
            build_type: Debug
            compiler: g++
          # DEBUG - Linux
          - os: ubuntu-latest
            name: Linux Debug (GCC)
            build_type: Debug
            compiler: g++
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up MSVC environment for clang-cl
      if: ${{ matrix.toolchain == 'clang-cl' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up LLVM-MinGW
      if: ${{ matrix.toolchain == 'llvm-mingw' }}
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
        $destination = Join-Path $env:RUNNER_TEMP "llvm-mingw"
        $package = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
        $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$package.zip"

        Invoke-WebRequest -Uri $url -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath $destination
        (Join-Path $destination "$package/bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Show candidate Windows toolchain
      if: ${{ matrix.toolchain == 'clang-cl' || matrix.toolchain == 'llvm-mingw' }}
      run: |
        ${{ matrix.compiler }} --version
        lld-link --version

    - name: Setup dependencies (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        ${{ matrix.compiler }} --version
        cmake --version

    - name: Configure with CMake
      run: >
        cmake -B build
        -S .
        ${{ runner.os == 'Windows' && matrix.compiler != 'cl' && '-G Ninja' || '' }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
        ${{ matrix.c_compiler && format('-DCMAKE_C_COMPILER={0}', matrix.c_compiler) || '' }}
        ${{ matrix.linker && format('-DCMAKE_LINKER={0}', matrix.linker) || '' }}
        -DENABLE_STATIC=ON
        -DENABLE_LTO=ON
        -DBUILD_TESTS=ON
        -DBUILD_TESTS_EXTRA=ON
        -DBUILD_EXECUTABLES_EXTRA=ON

    - name: Verify AVX2 and ThinLTO for candidate toolchains
      if: ${{ matrix.toolchain == 'clang-cl' || matrix.toolchain == 'llvm-mingw' }}
      run: |
        grep -Eq -- '(/arch:AVX2|-march=haswell)' build/build.ninja
        grep -q -- '-flto=thin' build/build.ninja
        
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Verify LLVM-MinGW runtime is statically linked
      if: ${{ matrix.toolchain == 'llvm-mingw' }}
      working-directory: ./build
      run: |
        if llvm-objdump -p casanchess.exe | grep -Eiq 'DLL Name: (libc\+\+|libunwind|libgcc|libstdc\+\+|libwinpthread|libomp)'; then
          echo "Unexpected LLVM-MinGW runtime DLL dependency"
          exit 1
        fi
        
    - name: Fix permissions (Linux)
      if: ${{ runner.os == 'Linux' }}
      working-directory: ./build
      run: chmod +x casanchess tests perft

    - name: Tests - Unit and Perft
      working-directory: ./build
      run: |
        EXTENSION_SUFFIX=${{ runner.os == 'Windows' && '.exe' || '' }}
        BASE_PATH=${{ runner.os == 'Windows' && matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}

        for exe_name in tests perft; do
          ./${BASE_PATH}${exe_name}${EXTENSION_SUFFIX}
        done

    - name: Bench
      working-directory: ./build
      run: |
        EXTENSION_SUFFIX=${{ runner.os == 'Windows' && '.exe' || '' }}
        BASE_PATH=${{ runner.os == 'Windows' && matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}

        echo bench | ./${BASE_PATH}casanchess${EXTENSION_SUFFIX}

    - name: Smoke Test - UCI
      working-directory: ./build
      run: |
        EXTENSION_SUFFIX=${{ runner.os == 'Windows' && '.exe' || '' }}
        BASE_PATH=${{ runner.os == 'Windows' && matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}
        
        ENGINE_BIN="./${BASE_PATH}casanchess${EXTENSION_SUFFIX}"

        timeout 30s bash -c "
        (
          echo 'uci'
          echo 'setoption name Hash value 32'
          echo 'isready'
          sleep 1
          
          # 1) Startpos go movetime
          echo 'position startpos'
          echo 'go movetime 500'
          sleep 1

          # New game / Clear state
          echo 'ucinewgame'
          echo 'isready'
          sleep 1

          # 2) Startpos go nodes
          echo 'position startpos'
          echo 'go nodes 50000'
          sleep 1
          
          # 3) FEN go inifinite and stop
          echo 'position fen 8/3P3k/n2K3p/2p3n1/1b4N1/2p1p1P1/8/3B4 w - - 0 1 moves g4f6 h7g7 f6h5 g7g6 d1c2'
          echo 'go infinite'
          sleep 2
          echo 'stop'
          sleep 1
          
          echo 'quit'
        ) | $ENGINE_BIN
        "

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler }}-engine
        path: |
          build/casanchess*
          build/Release/casanchess*
          build/*.nnue
        retention-days: 2
