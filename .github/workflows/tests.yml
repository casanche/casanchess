name: Build and Test

env:
  LLVM_MINGW_VERSION: "20260826"

on:
  push:
    branches: [ "master", "*/**" ]

jobs:
  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      EXE_SUFFIX: ${{ startsWith(matrix.os, 'windows-') && '.exe' || '' }}
      CONFIG_DIR: ${{ matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-24.04
            name: Linux Release (GCC)
            build_type: Release
            compiler: g++
          - os: ubuntu-24.04
            name: Linux Release (Clang)
            build_type: Release
            compiler: clang++
            c_compiler: clang # GoogleTest enables C and C++, so keep both compilers aligned
            toolchain: clang-musl
          - os: ubuntu-24.04
            name: Linux Debug (GCC)
            build_type: Debug
            compiler: g++
          # Windows
          - os: windows-2025
            name: Windows Release (MSVC)
            build_type: Release
            compiler: cl
          - os: windows-2025
            name: Windows Release (clang-cl)
            build_type: Release
            compiler: clang-cl
            c_compiler: clang-cl
            toolchain: clang-cl
          - os: windows-2025
            name: Windows Release (clang-mingw)
            build_type: Release
            compiler: x86_64-w64-mingw32-clang++
            c_compiler: x86_64-w64-mingw32-clang
            toolchain: llvm-mingw
          - os: windows-2025
            name: Windows Debug (clang-cl)
            build_type: Debug
            compiler: clang-cl
            c_compiler: clang-cl
            toolchain: clang-cl
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up MSVC environment for clang-cl
      if: ${{ matrix.toolchain == 'clang-cl' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up LLVM-MinGW
      if: ${{ matrix.toolchain == 'llvm-mingw' }}
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
        $destination = Join-Path $env:RUNNER_TEMP "llvm-mingw"
        $package = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
        $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$package.zip"

        Invoke-WebRequest -Uri $url -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath $destination
        (Join-Path $destination "$package/bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Configure and build with Clang and musl
      if: ${{ matrix.toolchain == 'clang-musl' }}
      run: |
        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace \
          alpine:3.24 \
          sh -euxc '
            apk add --no-cache build-base clang cmake file git lld llvm ninja binutils
            clang++ --version
            cmake --version
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
              -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
              -DCMAKE_LINKER_TYPE=LLD \
              -DENABLE_STATIC=ON \
              -DENABLE_LTO=ON \
              -DBUILD_TESTS=ON \
              -DBUILD_TESTS_EXTRA=ON \
              -DBUILD_EXECUTABLES_EXTRA=ON
            cmake --build build --parallel

            file build/casanchess | grep "statically linked"
            ! readelf -l build/casanchess | grep -q INTERP
            ! readelf -d build/casanchess | grep -q NEEDED
          '

    - name: Configure and build with CMake
      if: ${{ matrix.toolchain != 'clang-musl' }}
      run: |
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          ${{ matrix.compiler }} --version
          cmake --version
        fi

        cmake -B build \
          -S . \
          ${{ runner.os == 'Windows' && matrix.compiler != 'cl' && '-G Ninja' || '' }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          ${{ matrix.c_compiler && format('-DCMAKE_C_COMPILER={0}', matrix.c_compiler) || '' }} \
          ${{ matrix.toolchain == 'clang-cl' && '-DCMAKE_LINKER_TYPE=LLD' || '' }} \
          -DENABLE_STATIC=ON \
          -DENABLE_LTO=ON \
          -DBUILD_TESTS=ON \
          -DBUILD_TESTS_EXTRA=ON \
          -DBUILD_EXECUTABLES_EXTRA=ON

        cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Tests - Unit and Perft
      working-directory: ./build
      run: |
        for exe_name in tests perft; do
          ./${CONFIG_DIR}${exe_name}${EXE_SUFFIX}
        done

    - name: Bench
      working-directory: ./build
      run: echo bench | ./${CONFIG_DIR}casanchess${EXE_SUFFIX}

    - name: Smoke Test - UCI
      working-directory: ./build
      run: |
        ENGINE_BIN="./${CONFIG_DIR}casanchess${EXE_SUFFIX}"

        timeout 30s bash -c "
        (
          echo 'uci'
          echo 'setoption name Hash value 32'
          echo 'isready'
          sleep 1
          
          # 1) Startpos go movetime
          echo 'position startpos'
          echo 'go movetime 500'
          sleep 1

          # New game / Clear state
          echo 'ucinewgame'
          echo 'isready'
          sleep 1

          # 2) Startpos go nodes
          echo 'position startpos'
          echo 'go nodes 50000'
          sleep 1
          
          # 3) FEN go inifinite and stop
          echo 'position fen 8/3P3k/n2K3p/2p3n1/1b4N1/2p1p1P1/8/3B4 w - - 0 1 moves g4f6 h7g7 f6h5 g7g6 d1c2'
          echo 'go infinite'
          sleep 2
          echo 'stop'
          sleep 1
          
          echo 'quit'
        ) | $ENGINE_BIN
        "

    - name: Upload artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler }}-engine
        path: |
          build/casanchess*
          build/Release/casanchess*
          build/*.nnue
        retention-days: 2
