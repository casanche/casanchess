name: Build and Test

on:
  push:
    branches: [ "master", "*/**" ]

jobs:
  build_and_test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # RELEASE - Linux
          - os: ubuntu-latest
            build_type: Release
            compiler: g++
          - os: ubuntu-latest
            build_type: Release
            compiler: clang++
          # RELEASE - Windows
          - os: windows-latest
            build_type: Release
            compiler: cl
          - os: windows-2025
            build_type: Release
            compiler: g++
          # DEBUG - Windows
          - os: windows-2025
            build_type: Debug
            compiler: g++
          # DEBUG - Linux
          - os: ubuntu-latest
            build_type: Debug
            compiler: g++
    
    steps:
    - uses: actions/checkout@v7

    - name: Setup dependencies (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        ${{ matrix.compiler }} --version
        cmake --version

    - name: Configure with CMake
      run: >
        cmake -B build
        -S .
        ${{ runner.os == 'Windows' && matrix.compiler == 'g++' && '-G Ninja' || '' }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
        ${{ matrix.os == 'windows-2025' && matrix.compiler == 'g++' && '-DCMAKE_CXX_FLAGS=-g' || '' }}
        -DENABLE_STATIC=ON
        -DBUILD_TESTS=ON
        -DBUILD_TESTS_EXTRA=ON
        -DBUILD_EXECUTABLES_EXTRA=ON
        
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel
        
    - name: Fix permissions (Linux)
      if: ${{ runner.os == 'Linux' }}
      working-directory: ./build
      run: chmod +x casanchess tests perft

    - name: Tests - Unit and Perft
      working-directory: ./build
      run: |
        EXTENSION_SUFFIX=${{ runner.os == 'Windows' && '.exe' || '' }}
        BASE_PATH=${{ runner.os == 'Windows' && matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}

        for exe_name in tests perft; do
          ./${BASE_PATH}${exe_name}${EXTENSION_SUFFIX}
        done

    - name: Bench
      working-directory: ./build
      run: |
        EXTENSION_SUFFIX=${{ runner.os == 'Windows' && '.exe' || '' }}
        BASE_PATH=${{ runner.os == 'Windows' && matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}

        echo bench | ./${BASE_PATH}casanchess${EXTENSION_SUFFIX}

    - name: Configure crash dumps - MinGW
      if: ${{ matrix.os == 'windows-2025' && matrix.compiler == 'g++' }}
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\crash-dumps" | Out-Null
        $key = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\casanchess.exe"
        New-Item -Path $key -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value "$env:GITHUB_WORKSPACE\crash-dumps" -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 3 -Force | Out-Null

    - name: Install ProcDump - MinGW
      if: ${{ matrix.os == 'windows-2025' && matrix.compiler == 'g++' }}
      shell: pwsh
      run: |
        $archive = "$env:RUNNER_TEMP\procdump.zip"
        $directory = "$env:RUNNER_TEMP\procdump"
        Invoke-WebRequest `
          -Uri "https://download.sysinternals.com/files/Procdump.zip" `
          -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath $directory -Force
        if (-not (Test-Path "$directory\procdump64.exe")) {
          throw "ProcDump executable was not found after extraction"
        }

    - name: Smoke Test - UCI
      working-directory: ./build
      run: |
        EXTENSION_SUFFIX=${{ runner.os == 'Windows' && '.exe' || '' }}
        BASE_PATH=${{ runner.os == 'Windows' && matrix.compiler == 'cl' && format('{0}/', matrix.build_type) || '' }}
        
        ENGINE_BIN="./${BASE_PATH}casanchess${EXTENSION_SUFFIX}"

        if [[ "${{ matrix.os }}" == "windows-2025" && "${{ matrix.compiler }}" == "g++" ]]; then
          PROCDUMP="$(cygpath -w "$RUNNER_TEMP/procdump/procdump64.exe")"
          DUMP_DIR="$(cygpath -w "$GITHUB_WORKSPACE/crash-dumps")"
          ENGINE_WIN="$(cygpath -w "$PWD/${BASE_PATH}casanchess${EXTENSION_SUFFIX}")"
          MONITOR=( "$PROCDUMP" -accepteula -ma -e -n 1 -x "$DUMP_DIR" "$ENGINE_WIN" )
        else
          MONITOR=( "$ENGINE_BIN" )
        fi

        set +e
        {
          echo 'uci'
          echo 'setoption name Hash value 32'
          echo 'isready'
          sleep 1

          # 1) Startpos go movetime
          echo 'position startpos'
          echo 'go movetime 500'
          sleep 1

          # New game / Clear state
          echo 'ucinewgame'
          echo 'isready'
          sleep 1

          # 2) Startpos go nodes
          echo 'position startpos'
          echo 'go nodes 50000'
          sleep 1

          # 3) FEN go inifinite and stop
          echo 'position fen 8/3P3k/n2K3p/2p3n1/1b4N1/2p1p1P1/8/3B4 w - - 0 1 moves g4f6 h7g7 f6h5 g7g6 d1c2'
          echo 'go infinite'
          sleep 2
          echo 'stop'
          sleep 1

          echo 'quit'
        } | timeout 30s "${MONITOR[@]}"
        monitor_status=${PIPESTATUS[1]}
        set -e

        if [[ "$monitor_status" -ne 0 ]]; then
          exit "$monitor_status"
        fi

        if [[ "${{ matrix.os }}" == "windows-2025" && "${{ matrix.compiler }}" == "g++" ]] &&
           compgen -G "$GITHUB_WORKSPACE/crash-dumps/*.dmp" > /dev/null; then
          echo "ProcDump captured an engine crash"
          exit 1
        fi

    - name: List crash dumps - MinGW
      if: ${{ always() && matrix.os == 'windows-2025' && matrix.compiler == 'g++' }}
      shell: pwsh
      run: |
        Get-ChildItem "$env:GITHUB_WORKSPACE\crash-dumps" -Force -ErrorAction SilentlyContinue |
          Select-Object Name, Length, LastWriteTime

    - name: GDB diagnostics - MinGW
      if: ${{ failure() && matrix.os == 'windows-2025' && matrix.compiler == 'g++' }}
      working-directory: ./build
      run: |
        if ! command -v gdb >/dev/null 2>&1; then
          echo "gdb is not available on this runner"
          exit 0
        fi

        set +e

        run_gdb_case() {
          case_name="$1"
          shift
          echo "=== GDB: $case_name ==="
          {
            sleep 1
            printf '%s\n' "$@"
            sleep 5
          } | gdb -q -batch \
            -ex "set pagination off" \
            -ex "set confirm off" \
            -ex "run" \
            -ex "bt full" \
            --args ./casanchess.exe
        }

        run_gdb_case "startpos depth 5" \
          'uci' \
          'position startpos' \
          'go depth 5'

        run_gdb_case "startpos nodes 50000" \
          'uci' \
          'position startpos' \
          'go nodes 50000'

        run_gdb_case "tactical FEN infinite" \
          'uci' \
          'position fen 8/3P3k/n2K3p/2p3n1/1b4N1/2p1p1P1/8/3B4 w - - 0 1 moves g4f6 h7g7 f6h5 g7g6 d1c2' \
          'go infinite'

        echo "=== GDB: complete UCI smoke sequence ==="
        {
          sleep 1
          echo 'uci'
          echo 'setoption name Hash value 32'
          echo 'isready'
          sleep 1
          echo 'position startpos'
          echo 'go movetime 500'
          sleep 1
          echo 'ucinewgame'
          echo 'isready'
          sleep 1
          echo 'position startpos'
          echo 'go nodes 50000'
          sleep 1
          echo 'position fen 8/3P3k/n2K3p/2p3n1/1b4N1/2p1p1P1/8/3B4 w - - 0 1 moves g4f6 h7g7 f6h5 g7g6 d1c2'
          echo 'go infinite'
          sleep 2
          echo 'stop'
          sleep 1
          echo 'quit'
        } | gdb -q -batch \
          -ex "set pagination off" \
          -ex "set confirm off" \
          -ex "run" \
          -ex "bt full" \
          --args ./casanchess.exe

        set -e

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler }}-engine
        path: |
          build/casanchess*
          build/Release/casanchess*
          build/*.nnue
          crash-dumps/*.dmp
        retention-days: 2
